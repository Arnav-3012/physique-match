[project]
name = "physique-gap"
version = "0.0.0"
description = "PhysiqueGap workspace root (dev tooling + API runtime deps)"
requires-python = ">=3.12"
dependencies = [
    "physique-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
ml = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.uv]
default-groups = ["dev", "ml"]

[tool.uv.workspace]
members = ["packages/schemas"]

[tool.uv.sources]
physique-schemas = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ml/data", "synth/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "physique_schemas", "ml"]
