[project]
name = "physique-gap"
version = "0.0.0"
description = "PhysiqueGap workspace root (dev tooling + API runtime deps)"
requires-python = ">=3.12"
dependencies = [
    "physique-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "onnxruntime",
    "rank-bm25>=0.2.2",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
ml = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]
# Training/export only; not in default-groups so CI and the API image stay torch-free (ADR-028).
# Install: uv sync --group train
train = [
    "torch",
    "torchvision",
    "onnx",
    "pyyaml",
]

[tool.uv]
default-groups = ["dev", "ml"]

[tool.uv.workspace]
members = ["packages/schemas"]

[tool.uv.sources]
physique-schemas = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/api"]

[tool.ruff]
line-length = 120  # P4: raised from 100 (owner decision 2026-11-02, lint debt of ~260 wrapped-only lines)
target-version = "py312"
extend-exclude = ["ml/data", "synth/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"synth/spike.py" = ["E501"]  # one-off Blender diagnostics script with long log lines
"synth/render.py" = ["E501"]  # Blender scripts: long log and field lines
"synth/rig.py" = ["E501"]
"synth/probe.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "physique_schemas", "ml", "kb", "evals", "synth"]
