[project]
name = "physique-schemas"
version = "0.0.0"
description = "Pydantic contracts shared by API, agent and (via generated TS types) the web app"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physique_schemas"]
